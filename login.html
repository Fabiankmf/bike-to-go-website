<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" data-i18n="seo.description" content="Login und Registrierung für bike to go">
  <title data-i18n="seo.title">bike to go – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HEADER (copied from other pages) -->
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="bike to go - Zur Startseite">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18.5" cy="17.5" r="3.5"/>
            <circle cx="5.5" cy="17.5" r="3.5"/>
            <circle cx="15" cy="5" r="1"/>
            <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
          </svg>
        </div>
        <span class="logo-text">bike<span class="highlight">to</span>go</span>
        <span class="logo-badge">Deutschlandweit</span>
      </a>
      <nav class="main-nav" id="mainNav" aria-label="Hauptnavigation">
        <ul class="nav-list">
          <li><a href="arbeitgeber.html" class="nav-link" data-i18n="nav.arbeitgeber">Arbeitgeber</a></li>
          <li><a href="arbeitnehmer.html" class="nav-link" data-i18n="nav.arbeitnehmer">Arbeitnehmer</a></li>
          <li><a href="selbstaendige.html" class="nav-link" data-i18n="nav.selbstaendige">Selbständige</a></li>
          <li><a href="fahrradhaendler.html" class="nav-link" data-i18n="nav.fahrradhaendler">Fahrradhändler</a></li>
          <li><a href="kontakt.html" class="nav-link" data-i18n="nav.kontakt">Kontakt</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <div class="lang-selector">
          <select id="langSelect" aria-label="Sprache wählen">
            <option value="de">🇩🇪 DE</option>
            <option value="en">🇬🇧 EN</option>
            <option value="es">🇪🇸 ES</option>
          </select>
        </div>
        <a href="login.html" class="btn-login" aria-label="Login zum Portal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="btn-text-full">Login</span>
        </a>
        <button class="mobile-toggle" id="mobileToggle" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT: centered card -->
  <main class="container" style="max-width: 420px; margin: 2rem auto;">
    <div class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Anmelden</button>
        <button class="tab" data-tab="register">Registrieren</button>
      </div>
      <div class="tab-content active" id="loginTab">
        <form id="loginForm">
          <label for="loginEmail">E-Mail</label>
          <input type="email" id="loginEmail" required />
          <label for="loginPassword">Passwort</label>
          <input type="password" id="loginPassword" required />
          <button type="submit" class="btn-primary">Anmelden</button>
        </form>
      </div>
      <div class="tab-content" id="registerTab">
        <form id="registerForm">
          <label for="regName">Name</label>
          <input type="text" id="regName" required />
          <label for="regEmail">E-Mail</label>
          <input type="email" id="regEmail" required />
          <label for="regPassword">Passwort</label>
          <input type="password" id="regPassword" required />
          <label for="regPasswordRepeat">Passwort wiederholen</label>
          <input type="password" id="regPasswordRepeat" required />
          <button type="submit" class="btn-primary">Konto erstellen</button>
        </form>
      </div>
      <div id="loginMessage" style="margin-top:1rem; color:var(--color-success);"></div>
    </div>
  </main>

  <script type="module">
    const user = JSON.parse(localStorage.getItem('loggedInUser'));
    if (user && user.name) {
      const msg = document.createElement('div');
      msg.style.textAlign = 'center';
      msg.style.marginTop = '1rem';
      msg.textContent = `Eingeloggt als ${user.name}`;
      document.body.insertBefore(msg, document.querySelector('main'));
    }
  </script>

  <script type="module" src="js/translations.js"></script>
  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
